name: Android Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # NOTE: no "setup-android" step. ubuntu-latest already ships the Android SDK
      # (ANDROID_HOME) with licenses accepted. That extra step was what failed before.

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Disable lint-vital (it can fail a release build for non-code reasons)
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/no-lint-vital.gradle" <<'GRADLE'
          allprojects {
              tasks.configureEach { t ->
                  if (t.name.startsWith("lintVital")) { t.enabled = false }
              }
          }
          GRADLE

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using keystore from repository secrets"
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PASSWORD=$SECRET_STORE_PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$SECRET_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SECRET_KEY_PASS" >> "$GITHUB_ENV"
          else
            echo "No secrets found, generating a temporary signing key"
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/release.jks" \
              -storepass android123 -keypass android123 \
              -alias applock -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=AppLock Studio, O=Amrit, C=IN"
            echo "KEYSTORE_PASSWORD=android123" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=applock" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=android123" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK and AAB
        run: |
          set -o pipefail
          gradle assembleRelease bundleRelease --no-daemon --stacktrace --console=plain 2>&1 | tee build.log

      - name: Show only the errors
        if: failure()
        run: |
          sed 's#file:///home/runner/work/[^/]*/[^/]*/##' build.log > clean.log
          echo "=== KOTLIN / KSP ERRORS ==="
          grep -E "^e: " clean.log | head -30 || true
          echo "=== GRADLE ERRORS ==="
          grep -E "Execution failed for task|What went wrong" -A4 clean.log | head -40 || true
          grep -E "^e: " clean.log | head -15 | while IFS= read -r l; do echo "::error::$l"; done
          grep -E "Execution failed for task" -A3 clean.log | head -4 | tr '\n' ' ' | while IFS= read -r l; do echo "::error::$l"; done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CustomAppLockStudio-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: CustomAppLockStudio-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            clean.log
          if-no-files-found: ignore
